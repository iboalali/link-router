[package]
name = "link-router"
version = "0.1.0"
edition = "2021"
description = "Android-style URL and link router for Linux desktop and Chrome profiles"
license = "MIT"
repository = "https://github.com/iboalali/link-router"
readme = "README.md"
keywords = ["linux", "url", "browser", "gtk4", "chrome"]
categories = ["command-line-utilities", "gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
gtk4 = { version = "0.11", features = ["v4_14"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
